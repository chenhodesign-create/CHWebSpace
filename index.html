      display: flex;
      background: var(--brand);
      padding-bottom: env(safe-area-inset-bottom);

      height: var(--bar-h);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--white);
      text-decoration: none;
      font-size: 12px;
      line-height: 20px;
      white-space: nowrap;
      transition: background-color .2s ease, color .2s ease;
